# Postgres per lo sviluppo locale. In produzione si usa Postgres su Railway.
services:
  db:
    image: postgres:18-alpine
    container_name: coppr-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: coppr
    ports:
      - "5432:5432"
    volumes:
      # Da Postgres 18 i dati vivono in /var/lib/postgresql, non più in /data
      - coppr-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coppr"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  coppr-db-data:
